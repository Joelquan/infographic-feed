<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D3AF85">
<title>MicroKnow by KnowHoly</title>
<script src="manifest.js"></script>
<script src="topics.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #D3AF85; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #6E4410; display: flex; justify-content: center; align-items: stretch;
    overscroll-behavior: none;
  }
  #phone {
    position: relative; width: 100%; max-width: 480px; height: 100dvh;
    background: #D3AF85; overflow: hidden;
  }
  @media (min-width: 520px) {
    body { align-items: center; }
    #phone { height: min(92dvh, 900px); border-radius: 28px; border: 1px solid #8E5915;
             box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  }
  #feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory;
          scrollbar-width: none; overscroll-behavior: contain; }
  #feed::-webkit-scrollbar { display: none; }
  .screen { height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
            position: relative; display: flex; flex-direction: column; background: #D3AF85; }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 12px 26px;
    background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,0));
    pointer-events: none;
  }
  .topbar .meta { pointer-events: auto; min-width: 0; }
  .subject-tag {
    display: inline-block; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: #F4B315; font-weight: 700; margin-bottom: 4px;
  }
  .set-title { font-size: 21px; font-weight: 800; line-height: 1.15; }
  .speaker { font-size: 13px; color: #D3AF85; margin-top: 3px; }
  .actions { display: flex; gap: 8px; pointer-events: auto; }
  .btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(110,68,16,.35);
    background: rgba(142,89,21,.14); color: #6E4410; display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .btn:active { transform: scale(.93); }
  .btn svg { width: 20px; height: 20px; }
  .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 84px 8px 52px; }
  .art img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .counter {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    font-size: 12px; color: rgba(255,255,255,.65); background: rgba(0,0,0,.5);
    padding: 5px 10px; border-radius: 20px; z-index: 5;
  }
  .filter-chip {
    position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 5;
    display: none; align-items: center; gap: 8px; font-size: 12px; color: #D3AF85;
    background: #8E5915; padding: 6px 8px 6px 12px; border-radius: 20px;
    border: 1px solid rgba(211,175,133,.5);
  }
  .filter-chip.show { display: inline-flex; }
  .filter-chip button { background: none; border: none; color: #D3AF85; font-size: 14px; cursor: pointer; padding: 2px 6px; }
  .swipe-hint {
    position: absolute; left: 0; right: 0; bottom: calc(52px + env(safe-area-inset-bottom));
    text-align: center; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(255,255,255,.75); z-index: 5; pointer-events: none;
    animation: hintfade 2.6s ease-in-out infinite;
  }
  @keyframes hintfade { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  #picker {
    position: absolute; inset: 0; z-index: 20; background: rgba(211,175,133,.98);
    display: none; flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  #picker.open { display: flex; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .picker-head h2 { font-size: 18px; font-weight: 800; }
  .picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; overflow-y: auto; padding-bottom: 8px; }
  .pcard { background: #E7CDA3; border: 1px solid #8E5915; border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; color: #6E4410; padding: 0; font: inherit; }
  .pcard:active { transform: scale(.97); }
  .pcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #D3AF85; }
  .pcard .pinfo { padding: 10px 12px 12px; }
  .pcard .ptitle { font-size: 14px; font-weight: 700; }
  .pcard .pspeaker { font-size: 12px; color: #8E5915; margin-top: 2px; }
  .pcard.all { display: flex; align-items: center; justify-content: center; min-height: 120px;
               font-size: 15px; font-weight: 700; color: #8E5915; }
  #toast {
    position: absolute; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #8E5915; color: #D3AF85; font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 24px; opacity: 0; transition: all .25s ease; z-index: 30; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #empty { display: none; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 40px; color: #8E5915; font-size: 15px; line-height: 1.6; }
  #scrim {
    position: absolute; inset: 0; z-index: 24; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #drawer {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(78%, 300px); z-index: 25;
    background: #D3AF85; border-right: 1px solid #8E5915;
    transform: translateX(-102%); transition: transform .28s ease;
    display: flex; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 0 calc(12px + env(safe-area-inset-bottom));
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 0 14px 10px; }
  .drawer-head h2 { flex: 1; }
  .drawer-logo { width: 46px; height: 46px; border-radius: 13px; display: block; }
  .drawer-head h2 { font-size: 18px; font-weight: 800; }
  .drawer-brand { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: #8E5915; padding: 0 14px 8px; }
  #topicList { overflow-y: auto; padding: 0 8px; }
  .topic-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: none; border: none; color: #6E4410; font: inherit; text-align: left;
    padding: 13px 12px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600;
  }
  .topic-item:active { background: rgba(142,89,21,.18); }
  .topic-item.active { color: #8E5915; background: rgba(244,179,21,.4); }
  .topic-count { font-size: 12px; color: #8E5915; font-weight: 400; }
  .topic-item.active .topic-count { color: #8E5915; }
  .topgroup { display: flex; align-items: flex-start; gap: 10px; pointer-events: auto; min-width: 0; }
  .picker-section { grid-column: 1 / -1; font-size: 12px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: #8E5915; margin: 8px 2px 0; }
</style>
</head>
<body>
<div id="phone">
  <div id="feed"></div>
  <div id="empty">No card sets found.</div>

  <div class="filter-chip" id="filterChip">
    <span id="filterName"></span><button id="clearFilter" aria-label="Show all subjects">X</button>
  </div>

  <div id="picker" role="dialog" aria-label="Choose a subject">
    <div class="picker-head">
      <h2>Subjects</h2>
      <button class="btn" id="closePicker" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="Topics">
    <div class="drawer-head">
      <img class="drawer-logo" src="img/logo.webp" alt="MicroKnow">
      <h2>Topics</h2>
      <button class="btn" id="closeDrawer" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-brand">MicroKnow by KnowHoly</div>
    <div id="topicList"></div>
  </aside>

  <div id="toast"></div>
</div>

<script>
(function () {
  "use strict";
  var feed = document.getElementById("feed");
  var empty = document.getElementById("empty");
  var picker = document.getElementById("picker");
  var pickerGrid = document.getElementById("pickerGrid");
  var toast = document.getElementById("toast");
  var filterChip = document.getElementById("filterChip");
  var filterName = document.getElementById("filterName");

  var SETS = Array.isArray(window.MANIFEST) ? window.MANIFEST : [];
  var filter = null;
  var topic = "all";
  var toastTimer = null;
  var drawer = document.getElementById("drawer");
  var scrim = document.getElementById("scrim");
  var topicList = document.getElementById("topicList");
  var TOPICS = Array.isArray(window.TOPIC_ORDER) ? window.TOPIC_ORDER : ["bible", "servants"];
  var TOPIC_LABELS = window.TOPIC_LABELS || {};
  function topicLabel(t) { return TOPIC_LABELS[t] || t; }
  function topicOfSet(s) { return s.topic || "bible"; }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  function iconGrid() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>' +
      '<rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>';
  }
  function iconShare() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 15V4"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>';
  }

  function iconMenu() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
      '<path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  }

  function activeSets() {
    var sets = SETS;
    if (topic !== "all") sets = sets.filter(function (s) { return topicOfSet(s) === topic; });
    if (!filter) return sets;
    return sets.filter(function (s) { return s.slug === filter; });
  }

  function screensFor(set) {
    var out = [{ kind: "overview", src: set.overview, label: set.title + " overview" }];
    (set.cards || []).forEach(function (c, i) {
      out.push({ kind: "card", src: c.src, label: c.title || (set.title + " " + (i + 1)) });
    });
    return out;
  }

  function shareImage(src, label) {
    var done = function (msg) { showToast(msg); };
    function downloadFallback() {
      var a = document.createElement("a");
      a.href = src; a.download = safeName(label) + ".png";
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); }, 500);
      done("Image saved");
    }
    fetch(src).then(function (res) {
      if (!res.ok) throw new Error("fetch failed");
      return res.blob();
    }).then(function (blob) {
      var file = new File([blob], safeName(label) + ".png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: label }).then(function () {
          done("Shared");
        }).catch(function (err) {
          if (!err || err.name !== "AbortError") downloadFallback();
        });
      }
      downloadFallback();
    }).catch(function () { downloadFallback(); });
  }

  function safeName(s) {
    return String(s || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "card";
  }

  function renderFeed() {
    feed.innerHTML = "";
    var sets = activeSets();
    var screens = [];
    sets.forEach(function (set) {
      screensFor(set).forEach(function (sc) { screens.push({ set: set, sc: sc }); });
    });
    if (!screens.length) {
      feed.style.display = "none"; empty.style.display = "flex";
      empty.textContent = filter ? "No cards for this subject yet." : "No card sets found.";
      return;
    }
    feed.style.display = ""; empty.style.display = "none";
    var posInSet = {};
    screens.forEach(function (entry, i) {
      var set = entry.set, sc = entry.sc;
      var setScreens = screensFor(set);
      posInSet[set.slug] = (posInSet[set.slug] || 0) + 1;
      var pos = posInSet[set.slug];

      var screen = document.createElement("section");
      screen.className = "screen";

      var bar = document.createElement("div");
      bar.className = "topbar";
      bar.innerHTML =
        '<div class="topgroup"><button class="btn" data-act="menu" aria-label="Topics">' + iconMenu() + "</button>" +
        '<div class="meta"><div class="subject-tag">' + escapeHtml(set.title) + "</div>" +
        '<div class="speaker">' + escapeHtml(set.credit || "") + "</div></div></div>" +
        '<div class="actions">' +
        '<button class="btn" data-act="subjects" aria-label="Subjects">' + iconGrid() + "</button>" +
        '<button class="btn" data-act="share" aria-label="Share this card">' + iconShare() + "</button>" +
        "</div>";
      screen.appendChild(bar);

      var art = document.createElement("div");
      art.className = "art";
      var img = document.createElement("img");
      img.src = sc.src; img.alt = sc.label;
      img.loading = i < 2 ? "eager" : "lazy";
      img.onerror = function () { screen.style.display = "none"; };
      art.appendChild(img);
      screen.appendChild(art);

      var counter = document.createElement("div");
      counter.className = "counter";
      counter.textContent = pos + " / " + setScreens.length;
      screen.appendChild(counter);

      if (i === 0 && !filter) {
        var hint = document.createElement("div");
        hint.className = "swipe-hint";
        hint.textContent = "Swipe up";
        screen.appendChild(hint);
        setTimeout(function () { if (hint.parentNode) hint.parentNode.removeChild(hint); }, 6000);
      }

      bar.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        var act = b.getAttribute("data-act");
        if (act === "subjects") openPicker();
        else if (act === "menu") openDrawer();
        else shareImage(sc.src, sc.label);
      });

      feed.appendChild(screen);
    });
    feed.scrollTop = 0;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderPicker() {
    pickerGrid.innerHTML = "";
    var all = document.createElement("button");
    all.className = "pcard all";
    all.textContent = "All subjects";
    all.addEventListener("click", function () { setFilter(null); });
    pickerGrid.appendChild(all);
    TOPICS.forEach(function (t) {
      var tSets = SETS.filter(function (s) { return topicOfSet(s) === t; });
      if (!tSets.length) return;
      var h = document.createElement("div");
      h.className = "picker-section";
      h.textContent = topicLabel(t);
      pickerGrid.appendChild(h);
      tSets.forEach(function (set) { pickerGrid.appendChild(pickerCard(set)); });
    });
  }

  function renderDrawer() {
    topicList.innerHTML = "";
    var allBtn = document.createElement("button");
    allBtn.className = "topic-item" + (topic === "all" ? " active" : "");
    allBtn.innerHTML = "<span>All topics</span>" + '<span class="topic-count">' + SETS.length + "</span>";
    allBtn.addEventListener("click", function () { setTopic("all"); });
    topicList.appendChild(allBtn);
    TOPICS.forEach(function (t) {
      var sets = SETS.filter(function (s) { return topicOfSet(s) === t; });
      if (!sets.length) return;
      var b = document.createElement("button");
      b.className = "topic-item" + (topic === t ? " active" : "");
      b.innerHTML = "<span>" + escapeHtml(topicLabel(t)) + "</span>" +
        '<span class="topic-count">' + sets.length + "</span>";
      b.addEventListener("click", function () { setTopic(t); });
      topicList.appendChild(b);
    });
  }

  function setTopic(t) {
    topic = t;
    filter = null; filterChip.classList.remove("show");
    closeDrawer();
    renderFeed();
  }

  function openDrawer() { renderDrawer(); drawer.classList.add("open"); scrim.classList.add("show"); }
  function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("show"); }

  function pickerCard(set) {
    var card = document.createElement("button");
    card.className = "pcard";
    card.innerHTML = '<img src="' + set.overview + '" alt="" loading="lazy">' +
      '<div class="pinfo"><div class="ptitle">' + escapeHtml(set.title) + "</div>" +
      '<div class="pspeaker">' + escapeHtml(set.credit || "") + "</div></div>";
    card.addEventListener("click", function () { setFilter(set.slug); });
    return card;
  }

  function setFilter(slug) {
    filter = slug;
    var set = SETS.find(function (s) { return s.slug === slug; });
    if (set) { filterName.textContent = set.title; filterChip.classList.add("show"); }
    else { filterChip.classList.remove("show"); }
    closePicker();
    closeDrawer();
    renderFeed();
  }

  function openPicker() { renderPicker(); picker.classList.add("open"); }
  function closePicker() { picker.classList.remove("open"); }

  document.getElementById("closePicker").addEventListener("click", closePicker);
  document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  document.getElementById("clearFilter").addEventListener("click", function () { setFilter(null); });
  picker.addEventListener("click", function (ev) { if (ev.target === picker) closePicker(); });

  renderFeed();
})();
</script>
</body>
</html>
